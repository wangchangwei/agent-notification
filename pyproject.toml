[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-notification"
version = "0.1.2"
description = "Private cross-device status monitor for Hermes Agent"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx[http2]>=0.27,<1", "cryptography>=42,<47"]

[project.optional-dependencies]
qrcode = ["qrcode[pil]>=8,<9"]
dev = ["uvicorn[standard]>=0.30,<1"]

[project.scripts]
agent-monitor = "agent_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["agent_monitor*"]

[tool.setuptools.package-data]
"agent_monitor.plugin" = ["*.yaml"]
